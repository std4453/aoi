name: Check and publish Docker images

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      - name: Install complete pinned RAR decoder
        run: |
          sh scripts/install-7zip.sh "$RUNNER_TEMP/aoi-7zip"
          echo "$RUNNER_TEMP/aoi-7zip" >> "$GITHUB_PATH"
      - run: npm ci && npm --prefix server ci && npm --prefix client ci
      - name: RAR regression baseline
        run: npm run test:rar
      - run: npm run check

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH_IMAGE: >-
        ${{ github.event_name != 'pull_request' || (
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.type == 'User' &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
        ) }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Release tags must use vX.Y.Z or vX.Y.Z-prerelease'
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=ref,event=pr
            type=sha,format=long,enable=${{ github.event_name != 'pull_request' }}
            type=sha,format=long,prefix=pr-${{ github.event.number }}-sha-,enable=${{ github.event_name == 'pull_request' }}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
          flavor: latest=false
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: aoi:check
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test both deployment modes
        shell: bash
        run: |
          docker run -d --name aoi-backend -e AUTH_KEY=ci-check aoi:check
          docker run -d --name aoi-frontend -e FRONTEND_ONLY=true -e SERVER_SELECTION_ENABLED=true aoi:check
          for container in aoi-backend aoi-frontend; do
            healthy=false
            for attempt in $(seq 1 30); do
              if docker exec "$container" node healthcheck.cjs; then
                healthy=true
                break
              fi
              sleep 1
            done
            if [ "$healthy" != true ]; then
              docker logs "$container"
              exit 1
            fi
          done
          docker exec aoi-backend node -e 'fetch("http://127.0.0.1:3000/api/packs").then(r=>process.exit(r.status===401?0:1))'
          docker exec aoi-frontend node -e 'fetch("http://127.0.0.1:3000/api/health").then(r=>process.exit(r.status===404?0:1))'
      - name: Verify RAR decoding in the final runtime image
        run: |
          docker run --rm --network none --entrypoint node \
            -v "$PWD/scripts/check-rar.mjs:/rar-baseline/scripts/check-rar.mjs:ro" \
            -v "$PWD/server/test/fixtures/rar:/rar-baseline/server/test/fixtures/rar:ro" \
            aoi:check /rar-baseline/scripts/check-rar.mjs
      - uses: docker/login-action@v3
        if: env.PUBLISH_IMAGE == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        uses: docker/build-push-action@v6
        if: env.PUBLISH_IMAGE == 'true'
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
      - name: Clean up
        if: always()
        run: docker rm -f aoi-backend aoi-frontend || true

  dependency-image:
    needs: check
    name: Build ${{ matrix.service }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        service: [browser-login, flaresolverr]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH_IMAGE: >-
        ${{ github.event_name != 'pull_request' || (
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.type == 'User' &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
        ) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: image
        env:
          SERVICE: ${{ matrix.service }}
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-$SERVICE" >> "$GITHUB_OUTPUT"
      - name: Build image for native runtime validation
        uses: docker/build-push-action@v6
        with:
          context: scripts/${{ matrix.service }}
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: aoi-${{ matrix.service }}:check
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ matrix.arch }}
      - name: Test browser lifecycle and access boundaries
        if: matrix.service == 'browser-login'
        env:
          AOI_BROWSER_IMAGE: aoi-browser-login:check
        run: node scripts/browser-login/smoke.mjs
      - name: Test solver browser and synthetic request
        if: matrix.service == 'flaresolverr'
        env:
          AOI_FLARESOLVERR_IMAGE: aoi-flaresolverr:check
        run: node scripts/flaresolverr/smoke.mjs
      - uses: docker/login-action@v3
        if: env.PUBLISH_IMAGE == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish validated platform digest
        id: publish
        if: env.PUBLISH_IMAGE == 'true'
        uses: docker/build-push-action@v6
        with:
          context: scripts/${{ matrix.service }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }}
      - name: Export digest
        if: env.PUBLISH_IMAGE == 'true'
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        if: env.PUBLISH_IMAGE == 'true'
        with:
          name: digest-${{ matrix.service }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1
          if-no-files-found: error

  publish-dependencies:
    needs: dependency-image
    name: Publish ${{ matrix.service }} manifest
    if: >-
      ${{ github.event_name != 'pull_request' || (
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.type == 'User' &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
      ) }}
    strategy:
      matrix:
        service: [browser-login, flaresolverr]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Release tags must use vX.Y.Z or vX.Y.Z-prerelease'
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: image
        env:
          SERVICE: ${{ matrix.service }}
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-$SERVICE" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: metadata
        env:
          DOCKER_METADATA_PR_HEAD_SHA: 'true'
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=ref,event=pr
            type=sha,format=long,enable=${{ github.event_name != 'pull_request' }}
            type=sha,format=long,prefix=pr-${{ github.event.number }}-sha-,enable=${{ github.event_name == 'pull_request' }}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
          flavor: latest=false
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-${{ matrix.service }}-*
          merge-multiple: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform tags
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAGS: ${{ steps.metadata.outputs.tags }}
        working-directory: ${{ runner.temp }}/digests
        shell: bash
        run: |
          args=()
          while IFS= read -r tag; do args+=(--tag "$tag"); done <<< "$TAGS"
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          test "${#sources[@]}" -eq 2
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
