name: Check and publish Docker image

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y p7zip-full
      - run: npm ci && npm --prefix server ci && npm --prefix client ci
      - run: npm run check

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH_IMAGE: >-
        ${{ github.event_name != 'pull_request' || (
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.type == 'User' &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
        ) }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Release tags must use vX.Y.Z or vX.Y.Z-prerelease'
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=ref,event=pr
            type=sha,format=long,enable=${{ github.event_name != 'pull_request' }}
            type=sha,format=long,prefix=pr-${{ github.event.number }}-sha-,enable=${{ github.event_name == 'pull_request' }}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
          flavor: latest=false
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: aoi:check
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test both deployment modes
        shell: bash
        run: |
          docker run -d --name aoi-backend -e AUTH_KEY=ci-check aoi:check
          docker run -d --name aoi-frontend -e FRONTEND_ONLY=true -e SERVER_SELECTION_ENABLED=true aoi:check
          for container in aoi-backend aoi-frontend; do
            healthy=false
            for attempt in $(seq 1 30); do
              if docker exec "$container" node healthcheck.cjs; then
                healthy=true
                break
              fi
              sleep 1
            done
            if [ "$healthy" != true ]; then
              docker logs "$container"
              exit 1
            fi
          done
          docker exec aoi-backend node -e 'fetch("http://127.0.0.1:3000/api/packs").then(r=>process.exit(r.status===401?0:1))'
          docker exec aoi-frontend node -e 'fetch("http://127.0.0.1:3000/api/health").then(r=>process.exit(r.status===404?0:1))'
      - uses: docker/login-action@v3
        if: env.PUBLISH_IMAGE == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        uses: docker/build-push-action@v6
        if: env.PUBLISH_IMAGE == 'true'
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
      - name: Clean up
        if: always()
        run: docker rm -f aoi-backend aoi-frontend || true
